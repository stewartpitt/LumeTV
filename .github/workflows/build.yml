name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk LumeTV.apk

      - uses: actions/upload-artifact@v4
        with:
          name: LumeTV-apk
          path: LumeTV.apk

      # Publish a "latest" release so the APK has a fixed download link for the Fire Stick
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          files: LumeTV.apk
          make_latest: true
