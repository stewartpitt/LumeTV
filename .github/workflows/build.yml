name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04   # has the Android SDK preinstalled
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Accept Android SDK licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk LumeTV.apk

      - uses: actions/upload-artifact@v4
        with:
          name: LumeTV-apk
          path: LumeTV.apk

      # Publish a "latest" release so the APK has a fixed download link for the Fire Stick
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          files: LumeTV.apk
          make_latest: true
